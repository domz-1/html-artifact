<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile UI Prototype</title>
  <style>
    :root {
      --stage-bg: #eef2f6; --ink: #11161d; --muted: #647082;
      --accent: #0369a1; --blur: 24px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    }
    [data-theme="dark"] { --stage-bg: #0a0e14; --ink: #f1f5f9; --muted: #8b98ab; --accent: #38bdf8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--stage-bg); color: var(--ink);
      font-family: var(--font); display: grid; place-items: center; padding: 24px;
    }
    .studio { display: flex; flex-wrap: wrap; gap: 36px; align-items: center; justify-content: center; }
    .phone {
      width: 368px; height: 760px; border-radius: 50px; padding: 10px;
      background: linear-gradient(145deg, #d4d8df, #525965, #c9ced6);
      box-shadow: 0 32px 70px -20px rgba(10, 22, 38, 0.42);
    }
    .screen {
      position: relative; width: 100%; height: 100%; border-radius: 40px; overflow: hidden;
      background: linear-gradient(165deg, #e7f3fb, #d6ebf7, #f5efe6);
      display: flex; flex-direction: column;
    }
    [data-theme="dark"] .screen { background: linear-gradient(165deg, #08121f, #0e263b, #1a1e28); }
    .island {
      width: 104px; height: 26px; background: #000; border-radius: 999px;
      margin: 10px auto 0; flex-shrink: 0;
    }
    .view { flex: 1; padding: 18px 16px 96px; overflow-y: auto; }
    .view[hidden] { display: none; }
    .glass {
      background: rgba(255,255,255,0.52); backdrop-filter: blur(var(--blur)) saturate(180%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
      border: 1px solid rgba(255,255,255,0.75); border-radius: 22px; padding: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 10px 26px -8px rgba(12,32,54,0.14);
    }
    [data-theme="dark"] .glass {
      background: rgba(20,30,45,0.55); border-color: rgba(255,255,255,0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 14px 32px -10px rgba(0,0,0,0.48);
    }
    .tabbar {
      position: absolute; bottom: 18px; left: 20px; right: 20px; padding: 5px;
      border-radius: 999px; display: flex; gap: 4px;
    }
    .tabbar button {
      flex: 1; border: 0; background: transparent; color: var(--ink);
      padding: 9px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .tabbar button.active { background: var(--ink); color: var(--stage-bg); }
    .inspector { width: 280px; }
    .inspector button {
      width: 100%; padding: 10px 14px; border-radius: 12px; cursor: pointer;
      border: 1px solid rgba(127,127,127,0.25); background: transparent; color: var(--ink); font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="studio">
    <div class="phone">
      <div class="screen">
        <div class="island"></div>
        <section class="view" data-view="home">
          <div class="glass"><strong>Home Screen</strong><p style="font-size:13px;color:var(--muted);margin:6px 0 0">Replace with interactive mobile UI.</p></div>
        </section>
        <section class="view" data-view="explore" hidden>
          <div class="glass"><strong>Explore Screen</strong><p style="font-size:13px;color:var(--muted);margin:6px 0 0">Secondary interactive screen.</p></div>
        </section>
        <nav class="glass tabbar">
          <button class="active" data-go="home">Home</button>
          <button data-go="explore">Explore</button>
        </nav>
      </div>
    </div>
    <aside class="inspector glass">
      <div style="font-weight:600;margin-bottom:10px">Prototype Controls</div>
      <button id="themeBtn">Switch Light / Dark</button>
    </aside>
  </div>
  <script>
    document.querySelectorAll('[data-go]').forEach(btn => {
      btn.onclick = () => {
        const target = btn.dataset.go;
        document.querySelectorAll('[data-go]').forEach(b => b.classList.toggle('active', b === btn));
        document.querySelectorAll('[data-view]').forEach(v => v.hidden = v.dataset.view !== target);
      };
    });
    document.getElementById('themeBtn').onclick = () => {
      const h = document.documentElement;
      h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
    };
  </script>
</body>
</html>
