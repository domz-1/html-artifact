<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Dashboard</title>
  <style>
    :root {
      --bg: #f4f6f8; --surface: #ffffff; --subtle: #eef1f5;
      --text: #11161d; --muted: #647082; --border: rgba(17,22,29,0.10);
      --accent: #0f62fe; --ok: #15803d; --warn: #b45309;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0c1017; --surface: #141a24; --subtle: #1b2330;
      --text: #f1f5f9; --muted: #8b98ab; --border: rgba(241,245,249,0.10);
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 64px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select, button {
      font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    button { cursor: pointer; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .kpi-label { font-size: 12px; color: var(--muted); }
    .kpi-val { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; cursor: pointer; }
    .badge { padding: 3px 8px; border-radius: 999px; font-size: 11.5px; background: var(--subtle); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Workspace Overview</h1>
        <div style="font-size:13px;color:var(--muted)">Live client-side filtering &amp; SVG metrics</div>
      </div>
      <div class="controls">
        <input id="search" placeholder="Filter rows…" />
        <select id="status">
          <option value="all">All statuses</option>
          <option value="Active">Active</option>
          <option value="Review">Review</option>
        </select>
        <button id="themeBtn">Theme</button>
      </div>
    </header>

    <section class="kpis">
      <div class="kpi"><div class="kpi-label">Total Items</div><div class="kpi-val" id="kpiTotal">0</div></div>
      <div class="kpi"><div class="kpi-label">Active</div><div class="kpi-val" id="kpiActive">0</div></div>
      <div class="kpi"><div class="kpi-label">Avg Score</div><div class="kpi-val" id="kpiAvg">0</div></div>
    </section>

    <div class="grid">
      <div class="card">
        <table>
          <thead><tr><th>Name</th><th>Category</th><th>Status</th><th>Score</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="card">
        <div style="font-weight:600;margin-bottom:12px">Distribution</div>
        <svg id="chart" viewBox="0 0 320 180" style="width:100%;height:auto"></svg>
      </div>
    </div>
  </div>
  <script>
    const rows = [
      { name: 'Alpha Pipeline', cat: 'Infra', status: 'Active', score: 94 },
      { name: 'Checkout Flow', cat: 'Product', status: 'Review', score: 78 },
      { name: 'Search Index', cat: 'Data', status: 'Active', score: 88 },
      { name: 'Auth Gateway', cat: 'Security', status: 'Active', score: 97 },
    ];
    const render = () => {
      const q = document.getElementById('search').value.toLowerCase();
      const st = document.getElementById('status').value;
      const list = rows.filter(r =>
        (st === 'all' || r.status === st) &&
        (r.name.toLowerCase().includes(q) || r.cat.toLowerCase().includes(q))
      );
      document.getElementById('kpiTotal').textContent = list.length;
      document.getElementById('kpiActive').textContent = list.filter(r => r.status === 'Active').length;
      document.getElementById('kpiAvg').textContent = list.length
        ? Math.round(list.reduce((a, b) => a + b.score, 0) / list.length)
        : 0;
      document.getElementById('tbody').innerHTML = list.map(r =>
        `<tr><td>${r.name}</td><td>${r.cat}</td><td><span class="badge">${r.status}</span></td><td>${r.score}</td></tr>`
      ).join('');
      const svg = document.getElementById('chart');
      svg.innerHTML = list.map((r, i) => {
        const w = (r.score / 100) * 210;
        const y = 16 + i * 38;
        return `<text x="0" y="${y + 14}" fill="currentColor" font-size="11">${r.cat}</text>
                <rect x="70" y="${y}" width="${w}" height="20" rx="6" fill="var(--accent)" opacity="0.85"/>
                <text x="${76 + w}" y="${y + 14}" fill="var(--muted)" font-size="11">${r.score}</text>`;
      }).join('');
    };
    document.getElementById('search').oninput = render;
    document.getElementById('status').onchange = render;
    document.getElementById('themeBtn').onclick = () => {
      const h = document.documentElement;
      h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark';
    };
    render();
  </script>
</body>
</html>
